[project]
name = "lictor"
version = "0.2.0"
description = "Implementa escenarios Gherkin con un agente y los verifica de forma determinista."
readme = "README.md"
authors = [
    { name = "Jorge MB", email = "jmorenobl@gmail.com" }
]
requires-python = ">=3.12"
license = "EUPL-1.2"
license-files = ["LICENSE"]
keywords = ["gherkin", "bdd", "agents", "llm", "claude", "acceptance-testing", "quality-gates"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Natural Language :: Spanish",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing :: BDD",
    "Typing :: Typed",
]
dependencies = [
    "defusedxml>=0.7.1",
    "gherkin-official>=42.0.1",
    # Imported directly by the CLI (`RunnableConfig`); the bounds are those langgraph requires.
    "langchain-core>=1.4.7,<2",
    "langgraph>=1.2.18",
    "langgraph-checkpoint-sqlite>=3.1.2,<4",
    "pydantic>=2",
    "typer>=0.27.3",
]

[project.urls]
Homepage = "https://github.com/jmorenobl/lictor"
Repository = "https://github.com/jmorenobl/lictor"
Issues = "https://github.com/jmorenobl/lictor/issues"
Changelog = "https://github.com/jmorenobl/lictor/blob/master/CHANGELOG.md"

[project.scripts]
lictor = "lictor.cli:app"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "mutmut>=3.8.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.3",
    "types-defusedxml>=0.7.0.20260504",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["examples", ".audits"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "S", "N", "PT", "PL", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S603", "S607"]
"src/lictor/adapters/**" = ["S603", "PLR0913"]
"scripts/*.py" = ["S603", "S607"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["lictor"]

[[tool.mypy.overrides]]
module = ["gherkin.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
# Each repro case holds a whole venv: keeping them all fills the disk, above all with -n auto.
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 1
# A hung test fails with its traceback instead of stalling the suite. The slowest case takes 84 s
# locally with coverage and CI runners are up to ~2.6 times slower; mutmut kills its own mutants
# by CPU time well before this.
timeout = 600
timeout_method = "signal"
markers = [
    "repro: audit reproduction cases run against a real uv project (slow)",
]
filterwarnings = [
    "ignore:cannot collect test class 'TestCaseResult'.*:pytest.PytestCollectionWarning",
]

[tool.coverage.run]
branch = true
source = ["lictor"]

[tool.mutmut]
# The domain, plus the application modules whose unit tests are fast and cover them. The large use
# cases (verify_attempt, check_red, implement_scenario, prepare_driver) stay out: their decisions
# move into the domain, and their wiring is covered by manual mutants against the whole suite.
source_paths = [
    "src/lictor/domain/",
    "src/lictor/application/anchor.py",
    "src/lictor/application/events.py",
    "src/lictor/application/seal.py",
    "src/lictor/application/spec_history.py",
    "src/lictor/application/usecases/agent_events.py",
    "src/lictor/application/usecases/commit_green.py",
    "src/lictor/application/usecases/quarantine.py",
]
also_copy = ["src/"]
pytest_add_cli_args_test_selection = [
    "tests/unit/test_rules.py",
    "tests/unit/test_routing.py",
    "tests/unit/test_model.py",
    "tests/unit/test_anchor.py",
    "tests/unit/test_events.py",
    "tests/unit/test_agent_events.py",
    "tests/unit/test_seal.py",
    "tests/unit/test_gherkin_source.py",
    "tests/unit/test_spec_history.py",
    "tests/unit/test_spec_rules.py",
    "tests/unit/test_progress.py",
    "tests/unit/test_implement_scenario.py",
    "tests/unit/test_prepare_driver.py",
    "tests/unit/test_commit_green.py",
    "tests/unit/test_quarantine.py",
]
