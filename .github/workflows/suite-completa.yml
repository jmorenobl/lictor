name: Suite completa

# Everything a pull request leaves out: `repro` on every platform and every Python, and the
# `exhaustive` cells of the matrices. Every night, by hand, and before every release (release.yml
# calls it, and publishes only if it passes).
#
# Two cells also measure, without blocking anything:
# - Linux with Python 3.12 runs under coverage. A pull request enforces the coverage of everything
#   but `repro` (the `coverage` control of lictor.json); this is the whole number, `repro` included.
# - Linux with Python 3.13, the Python of the `repro` jobs of a pull request, keeps the duration of
#   every `repro` case, without coverage: copied over .test_durations, it is what splits them in
#   parts.

on:
  schedule:
    # Not on the hour: GitHub delays the scheduled runs it has most of, by hours.
    - cron: "17 1 * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  full:
    name: Suite completa (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    # `--dist worksteal`: with the default (`load`) each worker starts with a run of consecutive
    # tests, a quarter of its share, and the `repro` cases are collected first. Once that run held
    # every one of them, macOS (3 workers) ran them all in one worker, one after another, while the
    # other two were idle after 3 min: the job grew from 36 to over 90 min in ten days, with the
    # unit tests and not the `repro` cases. With work stealing an idle worker takes from a busy one.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        python: ["3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
      MEASURES_COVERAGE: ${{ matrix.os == 'ubuntu-24.04' && matrix.python == '3.12' }}
      KEEPS_DURATIONS: ${{ matrix.os == 'ubuntu-24.04' && matrix.python == '3.13' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.18"
      - run: uv sync --all-groups --frozen
      - if: env.MEASURES_COVERAGE != 'true' && env.KEEPS_DURATIONS != 'true'
        run: uv run pytest tests -n auto --dist worksteal -q -m "not toolchain"
      - if: env.MEASURES_COVERAGE == 'true'
        run: uv run pytest tests -n auto --dist worksteal -q -m "not toolchain" --cov=lictor --cov-branch --cov-report=term
      - if: always() && env.MEASURES_COVERAGE == 'true'
        run: >-
          echo "Cobertura completa, con repro: $(uv run coverage report --format=total) %"
          >> "$GITHUB_STEP_SUMMARY"
      - if: env.KEEPS_DURATIONS == 'true'
        run: >-
          uv run pytest tests -n auto --dist worksteal -q -m "not toolchain"
          --store-durations --durations-path "$RUNNER_TEMP/all-durations.json"
      - if: env.KEEPS_DURATIONS == 'true'
        run: >-
          jq --indent 2 'with_entries(select(.key | startswith("tests/integration/repro/"))) | map_values(. * 1000 | round / 1000)'
          "$RUNNER_TEMP/all-durations.json" > "$RUNNER_TEMP/test_durations"
      - if: env.KEEPS_DURATIONS == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test_durations
          path: ${{ runner.temp }}/test_durations
          retention-days: 30

  # The cases on Go and Node with the generic profile (ADR-0020): only here are the toolchains, so
  # every other job leaves them out by their mark. A runner without one fails instead of skipping
  # (`LICTOR_REQUIRE_TOOLCHAINS`). Linux alone until the harness settles (D7 of 0.23.0).
  toolchains:
    name: "Cadenas: Go y Node"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LICTOR_REQUIRE_TOOLCHAINS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.18"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: go install gotest.tools/gotestsum@v1.13.0
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: uv sync --all-groups --frozen
      - run: uv run pytest tests -n auto --dist worksteal -q -m "toolchain"

  budget:
    name: Presupuesto
    needs: [full, toolchains]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # An alarm, never a gate: a failure of the script must not stop the release that waits on this.
    continue-on-error: true
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.18"
      # Each job against its budget, without the critical path of a pull request: these run apart.
      - env:
          GH_TOKEN: ${{ github.token }}
          JOBS_ENDPOINT: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs?per_page=100
        run: uv run --no-project --with defusedxml python scripts/ci_budget.py full-suite-jobs "$JOBS_ENDPOINT"
