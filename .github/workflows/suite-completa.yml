name: Suite completa

# Everything a pull request leaves out: `repro` on every platform and every Python, and the
# `exhaustive` cells of the matrices. Every night, by hand, and before every release (release.yml
# calls it, and publishes only if it passes).

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  full:
    name: Suite completa (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    # The whole suite took 35-50 min on macOS, the slowest, in one job.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        python: ["3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.18"
      - run: uv sync --all-groups --frozen
      - run: uv run pytest tests -n auto -q
