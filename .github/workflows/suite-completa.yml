name: Suite completa

# Everything a pull request leaves out: `repro` on every platform and every Python, and the
# `exhaustive` cells of the matrices. Every night, by hand, and before every release (release.yml
# calls it, and publishes only if it passes).
#
# Two cells also measure, without blocking anything:
# - Linux with Python 3.12 runs under coverage. A pull request enforces the coverage of everything
#   but `repro` (the `coverage` control of lictor.json); this is the whole number, `repro` included.
# - Linux with Python 3.13, the Python of the `repro` jobs of a pull request, keeps the duration of
#   every `repro` case, without coverage: copied over .test_durations, it is what splits them in
#   parts.

on:
  schedule:
    # Not on the hour: GitHub delays the scheduled runs it has most of, by hours.
    - cron: "17 1 * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  full:
    name: Suite completa (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    # The whole suite took 35-50 min on macOS, the slowest, in one job.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        python: ["3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
      MEASURES_COVERAGE: ${{ matrix.os == 'ubuntu-24.04' && matrix.python == '3.12' }}
      KEEPS_DURATIONS: ${{ matrix.os == 'ubuntu-24.04' && matrix.python == '3.13' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.18"
      - run: uv sync --all-groups --frozen
      - if: env.MEASURES_COVERAGE != 'true' && env.KEEPS_DURATIONS != 'true'
        run: uv run pytest tests -n auto -q
      - if: env.MEASURES_COVERAGE == 'true'
        run: uv run pytest tests -n auto -q --cov=lictor --cov-branch --cov-report=term
      - if: always() && env.MEASURES_COVERAGE == 'true'
        run: >-
          echo "Cobertura completa, con repro: $(uv run coverage report --format=total) %"
          >> "$GITHUB_STEP_SUMMARY"
      - if: env.KEEPS_DURATIONS == 'true'
        run: >-
          uv run pytest tests -n auto -q
          --store-durations --durations-path "$RUNNER_TEMP/all-durations.json"
      - if: env.KEEPS_DURATIONS == 'true'
        run: >-
          jq --indent 2 'with_entries(select(.key | startswith("tests/integration/repro/")))'
          "$RUNNER_TEMP/all-durations.json" > "$RUNNER_TEMP/test_durations"
      - if: env.KEEPS_DURATIONS == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test_durations
          path: ${{ runner.temp }}/test_durations
          retention-days: 30
