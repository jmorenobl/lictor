name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A pull request runs in layers. Every platform runs everything small and medium; the audit
  # reproduction cases (`repro`, each one a real project built with uv) run once under coverage in
  # the self-verification, on Linux, and once on macOS, split in three by duration. The cells of a
  # matrix beyond one per class (`exhaustive`) and `repro` on every platform run in
  # suite-completa.yml: every night, and before every release.
  gates:
    name: Puertas (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        python: ["3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.18"
      - run: uv sync --all-groups --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy --strict src scripts
      - run: uv run python scripts/check_architecture.py
      # Coverage, with its thresholds, is enforced once by the self-verification (the `coverage`
      # and `coverage-domain` controls of lictor.json); measuring it here too doubled the cost.
      - run: uv run pytest tests -n auto -q -m "not repro"

  repro-macos:
    name: Repro (macos-15, Python 3.14, parte ${{ matrix.group }} de 3)
    runs-on: macos-15
    # The whole of repro took 35-50 min here in one job; a part, about a third of that.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3]
    env:
      UV_PYTHON: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.18"
      - run: uv sync --all-groups --frozen
      # The parts come from .test_durations, measured; a case missing there counts as the average.
      - run: >-
          uv run pytest tests -n auto -q -m "repro and not exhaustive"
          --splits 3 --group ${{ matrix.group }} --splitting-algorithm least_duration

  supply-chain:
    name: Dependencias y secretos
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.18"
      - run: uv sync --all-groups --frozen
      - run: uv run python scripts/audit_dependencies.py
      - name: Instalar gitleaks
        run: |
          curl -fsSLo gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP" gitleaks
          rm gitleaks.tar.gz
      - run: '"$RUNNER_TEMP/gitleaks" detect --no-banner'

  self-verification:
    name: Lictor se verifica a sí mismo
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.18"
      - name: Instalar gitleaks
        run: |
          curl -fsSLo gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP" gitleaks
          rm gitleaks.tar.gz
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: uv sync --all-groups --frozen
      # Every control, without the acceptance (L3): its suite, tests/integration, already runs inside
      # the `coverage` control, which fails on any failed test, so running it again cost ~20 min.
      # A control declared at L3 in lictor.json would be skipped here too: Lictor declares none.
      - run: uv run lictor check --keep-going --level L1,L2,L4,L5
      # Logs, reports and the mutation survivors: what tells two passes or two platforms apart.
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: autoverificacion
          path: .lictor/check/
          retention-days: 30
