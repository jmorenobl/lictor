name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The time budget of each job is in scripts/ci_budget.py and in AGENTS.md («What to run and
# when»). `timeout-minutes` is only the cut against a hung job, about 2.5 times what a job usually
# takes: runners differ up to 1.8 times, and a cut near the budget would fail work that didn't grow.
# A `lictor check` step's cut comes from the `timeout_s` of its controls instead: the slowest plus
# what the rest of the step takes, so Lictor cuts a hung control first (test_config.py holds it).
# The `budget` job at the end is the alarm: it warns, and never fails.

jobs:
  # A pull request runs in layers. Everything small and medium runs on Linux with every Python and
  # on macOS with one: Python 3.12 on macOS is what a maintainer runs locally. The audit
  # reproduction cases (`repro`, each one a real project built with uv) run once on Linux and once
  # on macOS, split in three by duration. The cells of a matrix beyond one per class (`exhaustive`)
  # and `repro` on every platform run in suite-completa.yml: every night, and before every release.
  gates:
    name: Puertas (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: "3.12"}
          - {os: ubuntu-24.04, python: "3.13"}
          - {os: ubuntu-24.04, python: "3.14"}
          - {os: macos-15, python: "3.14"}
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.18"
      - run: uv sync --all-groups --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy --strict src scripts
      - run: uv run python scripts/check_architecture.py
      # Coverage, with its thresholds, is enforced once by the self-verification (the `coverage`
      # and `coverage-domain` controls of lictor.json); measuring it here too doubled the cost.
      - run: uv run pytest tests -n auto -q -m "not repro" --junitxml "$RUNNER_TEMP/gates.xml"
      # A test outside `repro` slower than 10 s is a warning, never a failure.
      - if: always()
        run: uv run python scripts/ci_budget.py slow-tests "$RUNNER_TEMP/gates.xml"

  repro:
    name: Repro (${{ matrix.os }}, Python ${{ matrix.python }}, parte ${{ matrix.group }} de 3)
    runs-on: ${{ matrix.os }}
    # A part took 6-12 min on macOS. Three parts keep a Linux one (about 7 min) under a macOS one,
    # which sets the critical path; four would shorten nothing.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        group: [1, 2, 3]
        include:
          # Python 3.13 on Linux: the self-verification runs 3.12, and so does a maintainer.
          - {os: ubuntu-24.04, python: "3.13"}
          - {os: macos-15, python: "3.14"}
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.18"
      - run: uv sync --all-groups --frozen
      # The parts come from .test_durations, measured; a case missing there counts as the average.
      - run: >-
          uv run pytest tests -n auto -q -m "repro and not exhaustive"
          --splits 3 --group ${{ matrix.group }} --splitting-algorithm least_duration

  supply-chain:
    name: Dependencias y secretos
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.18"
      - run: uv sync --all-groups --frozen
      - run: uv run python scripts/audit_dependencies.py
      - name: Instalar gitleaks
        run: |
          curl -fsSLo gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP" gitleaks
          rm gitleaks.tar.gz
      - run: '"$RUNNER_TEMP/gitleaks" detect --no-banner'

  # The self-verification runs every control but the acceptance (L3), in two jobs that run at once:
  # L1, L2 and L4 here, the mutation (L5) in the next one. Split by level, not by id, so a new L5
  # control goes to its place by itself. Together they run exactly one `lictor check` of L1-L5. The
  # acceptance is the `repro` cases, which the `repro` jobs run in parts, and the `coverage` control
  # runs everything else: no test runs twice. A control declared at L3 in lictor.json would be
  # skipped too: Lictor declares none, and test_config.py checks the two steps cover the rest.
  self-verification:
    name: Lictor se verifica a sí mismo
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.18"
      # Which runner it got: a slow one explains a duration the code doesn't.
      - run: lscpu
      - name: Instalar gitleaks
        run: |
          curl -fsSLo gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP" gitleaks
          rm gitleaks.tar.gz
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: uv sync --all-groups --frozen
      # Its own cut, below the job's: if Lictor hangs, only this step stops, and the next one still
      # keeps `.lictor/check/`. A cancelled job runs no step after it, so it would leave no log.
      # Lictor cuts first: each control's `timeout_s` (600 s by default) stays at least 2 min under
      # this cut, so a hung control fails with its log and its verdict and `--keep-going` goes on.
      # 15 min: a hung `unit` cut at 600 s with `coverage` still behind it.
      - run: uv run lictor check --keep-going --level L1,L2,L4
        timeout-minutes: 15
      # Logs and reports: what tells two passes or two platforms apart.
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: autoverificacion
          path: .lictor/check/
          retention-days: 30

  # The mutation is linear in mutants (about 38 ms each on this runner, with 4 children), and grows
  # with the domain. Its budget warns long before its cut; split it in shards at about 13 000.
  mutation:
    name: Mutación
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # The whole history, like the self-verification: `check` has never run on a shallow clone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.18"
      - run: lscpu
      - run: uv sync --all-groups --frozen
      # The `mutation` control's `timeout_s` (900 s) cuts before this step: its log ends at the last
      # progress line of mutmut, and its verdict says it was cut.
      - run: uv run lictor check --keep-going --level L5
        timeout-minutes: 18
      # The log, the score and the survivors (`mutation-survivors.txt`).
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutacion
          path: .lictor/check/
          retention-days: 30

  budget:
    name: Presupuesto
    needs: [gates, repro, supply-chain, self-verification, mutation]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.18"
      # The script asks the API itself: a failed answer (a 502 once failed this job) is asked
      # again and, if it never comes, is a warning; a failure of the script still fails the job.
      # Only the reader's own dependency, not the whole environment: this job reads, nothing else.
      - env:
          GH_TOKEN: ${{ github.token }}
          JOBS_ENDPOINT: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs?per_page=100
        run: uv run --no-project --with defusedxml python scripts/ci_budget.py api-jobs "$JOBS_ENDPOINT"
